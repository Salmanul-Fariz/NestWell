<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nestwellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#nestwellGrad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="6.5" y="6.5" width="87" height="87" rx="25.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Stylized Geometric Shield & Vault Lock Nest -->
  <path d="M50 22 C64 22 72 26 72 38 C72 58 50 78 50 78 C50 78 28 58 28 38 C28 26 36 22 50 22 Z" fill="url(#shieldGrad)" />
  
  <!-- Inner "N" and Keyhole Motif -->
  <path d="M42 36 L42 60 M42 36 L58 60 M58 36 L58 60" stroke="#4F46E5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Sparkle Accent -->
  <circle cx="50" cy="30" r="2.5" fill="#4F46E5" />
</svg>
